# Producción: VM Azure + DuckDNS + Caddy (HTTPS)
# Uso: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Variables requeridas en .env.prod:
#   DOMAIN=velora-xxx.duckdns.org
#   MYSQL_ROOT_PASSWORD=...
#   POSTGRES_PASSWORD=...
#   MSSQL_SA_PASSWORD=...

services:
  mysql:
    image: mysql:8.0
    container_name: velora-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Velora_Mysql_2026!}
      MYSQL_DATABASE: velora_betplay
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/mysql/init.sql:/docker-entrypoint-initdb.d/01-velora.sql:ro
    networks:
      - velora
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          '127.0.0.1',
          '-uroot',
          '-p${MYSQL_ROOT_PASSWORD:-Velora_Mysql_2026!}',
        ]
      interval: 10s
      timeout: 5s
      retries: 15

  postgres:
    image: postgres:16-alpine
    container_name: velora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-velora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Velora_Pg_2026!}
      POSTGRES_DB: velora_bets
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - velora
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 15

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: velora-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Velora_Sql_2026!}
    volumes:
      - mssql_data:/var/opt/mssql
      - ./database/mssql:/mssql-init:ro
    networks:
      - velora
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1',
        ]
      interval: 20s
      timeout: 10s
      retries: 20

  mongo:
    image: mongo:7
    container_name: velora-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: velora_audit
    volumes:
      - mongo_data:/data/db
      - ./database/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - velora
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 15

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: velora-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: mysql
      DB_PORT: 3306
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MSSQL_HOST: mssql
      MSSQL_PORT: 1433
      MONGO_URI: mongodb://mongo:27017
    volumes:
      - backend_uploads:/app/uploads
      - ./backend/secrets:/app/secrets:ro
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - velora
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Same-origin vía Caddy: el browser llama /api sin host externo
        VITE_API_URL: ''
    container_name: velora-frontend
    restart: unless-stopped
    networks:
      - velora
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    container_name: velora-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN=your-subdomain.duckdns.org in .env.prod}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - velora
    depends_on:
      - frontend
      - backend

networks:
  velora:
    driver: bridge

volumes:
  mysql_data:
  postgres_data:
  mssql_data:
  mongo_data:
  backend_uploads:
  caddy_data:
  caddy_config:
